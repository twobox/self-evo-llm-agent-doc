name: Apply stage 4 pilot

on:
  push:
    branches:
      - codex/add-pilot-quick-read
    paths:
      - '.github/workflows/apply-stage4-pilot.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v4
        with:
          ref: codex/add-pilot-quick-read
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply quick-reading sections
        run: python scripts/apply_stage4_pilot.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate metadata and pilot structure
        run: |
          python scripts/validate_notes.py . --require-schema
          python scripts/check_links.py .
          python scripts/generate_readme.py . --check --require-markers

      - name: Commit pilot note changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes
          git commit -m 'add quick-reading layers to pilot notes'
          git push origin HEAD:codex/add-pilot-quick-read
