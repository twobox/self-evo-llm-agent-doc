name: Finalize stage 3

on:
  push:
    branches:
      - codex/migrate-note-metadata
    paths:
      - '.github/workflows/finalize-stage3.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stage 3 branch
        uses: actions/checkout@v4
        with:
          ref: codex/migrate-note-metadata
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fix schema documentation and regenerate README
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/metadata-schema.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "  cross_task: ''\n  venue_track: ''\n  arxiv_id: ''",
              "  cross_task: ''\n  arxiv_id: ''",
          )
          text = text.replace("### 4.4 `learning_stage`", "### 4.5 `learning_stage`")
          text = text.replace("### 4.5 `parameter_update`", "### 4.6 `parameter_update`")
          text = text.replace("### 4.6 `cross_task`", "### 4.7 `cross_task`")
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/generate_readme.py . --write

      - name: Run tests and repository checks
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          python scripts/validate_notes.py . --require-schema
          python scripts/check_links.py .
          python scripts/generate_readme.py . --check --require-markers

      - name: Commit final stage 3 fixes
        run: |
          if git diff --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/metadata-schema.md
          git commit -m 'finalize metadata schema migration'
          git push origin HEAD:codex/migrate-note-metadata
