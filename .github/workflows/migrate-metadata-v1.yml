name: Migrate metadata v1

on:
  push:
    branches:
      - codex/migrate-note-metadata
    paths:
      - 'scripts/migrate_metadata_v1.py'
      - '.github/workflows/migrate-metadata-v1.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: codex/migrate-note-metadata
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run deterministic migration
        run: python scripts/migrate_metadata_v1.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate migrated metadata
        run: python scripts/validate_notes.py . --require-schema

      - name: Check local Markdown links
        run: python scripts/check_links.py .

      - name: Check generated README index
        run: python scripts/generate_readme.py . --check --require-markers

      - name: Commit migration results
        run: |
          if git diff --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md notes docs tests
          git commit -m 'migrate notes to metadata schema 1.0'
          git push origin HEAD:codex/migrate-note-metadata
